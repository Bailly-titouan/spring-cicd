name: Configuation Java
run-name: Configuation Java

on:
  workflow_dispatch:

jobs:
  affichage:
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: "Vérifier la version de Java"
      run: java -version
    
    - name: "Vérifier la version de Maven"
      run: mvn -version
