name: CI/CD Pipeline
run-name: CI/CD Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: "Récupérer le code source"
      uses: actions/checkout@v4

    - name: "Configurer Java 21"
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: "Télécharger le rapport JaCoCo"
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: results/site/jacoco/

    - name: "Initialiser CodeQL"
      uses: github/codeql-action/init@v4
      with:
        languages: java

    - name: "Compiler et exécuter les tests"
      run: mvn clean verify -Dspring.profiles.active=test

    - name: "Analyser avec CodeQL"
      uses: github/codeql-action/analyze@v4
      with:
        output: results

    - name: "Convertir les résultats en CSV"
      uses: mr-sherman/sarif-to-csv@v2.4
      with:
        input-file: results/java.sarif
        output-file: results/codeql.csv

    - name: "Télécharger les résultats CodeQL"
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results
        path: results/codeql.csv
